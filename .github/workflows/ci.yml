name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      # lib/client.js is generated, not committed, so `git diff` cannot see it.
      # Regenerate over a saved copy: a non-deterministic generator would ship
      # a different plugin on every build.
      - name: Check the generated plugin client is reproducible
        run: |
          cp packages/oardsh-dsh-plugin/lib/client.js "${RUNNER_TEMP}/client.js"
          npm run build:plugin
          diff "${RUNNER_TEMP}/client.js" packages/oardsh-dsh-plugin/lib/client.js

  rust:
    name: Rust
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # tauri::generate_context! needs ../dist, and the resource directories
      # declared in tauri.conf.json must exist before the build script runs.
      - name: Prepare frontend and runtime
        run: npm run prepare-runtime && npm run build

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test
